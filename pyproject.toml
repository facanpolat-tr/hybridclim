[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridclim"
version = "1.0.0"
description = "Station-anchored, DEM-resolution temperature, precipitation and design-rainfall surfaces from CHELSA and ERA5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fethi Ahmet Canpolat" }]

[project.urls]
Repository = "https://github.com/facanpolat-tr/hybridclim"
keywords = ["design rainfall", "regional frequency analysis", "L-moments", "ERA5", "CHELSA", "downscaling", "flood"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.scripts]
hybridclim-download = "hybridclim.download:main"
hybridclim = "hybridclim.maps:main"

[tool.setuptools]
packages = ["hybridclim"]
